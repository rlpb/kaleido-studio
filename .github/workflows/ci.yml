name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: types, config and live API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript, strict
        run: npm run typecheck

      # electron-builder validates its config as the first step of a packaging
      # run, so an unknown key otherwise fails all three platform jobs minutes
      # in, with a message naming the section but never the key.
      - name: Packaging configuration
        run: npm run check:config

      # Reads the public OpenRouter catalog routes, no API key involved. It
      # fails when the API changes shape under the normaliser, which is the
      # thing no local test can notice.
      - name: Live catalog and cost estimator
        run: npm run check

  package:
    name: package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Builds the real installers on every push, so a packaging break surfaces
      # here rather than on the day a release is cut.
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: kaleido-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
