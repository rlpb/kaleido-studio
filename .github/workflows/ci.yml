name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: types, config and live API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript, strict
        run: npm run typecheck

      # Nothing known-vulnerable in what a user ends up running.
      - name: Audit the dependencies
        run: npm audit --omit=dev --audit-level=high

      # electron-builder validates its config as the first step of a packaging
      # run, so an unknown key otherwise fails all three platform jobs minutes
      # in, with a message naming the section but never the key.
      - name: Packaging configuration
        run: npm run check:config

      # Reads the public OpenRouter catalog routes, no API key involved. It
      # fails when the API changes shape under the normaliser, which is the
      # thing no local test can notice.
      - name: Live catalog and cost estimator
        run: npm run check

  package:
    name: package (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Builds the real installers on every push, so a packaging break surfaces
      # here rather than on the day a release is cut.
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Read out of the binary that was just built, not out of the config that
      # was supposed to set them: a key electron-builder ignored leaves the
      # config looking right and the app unprotected.
      - name: Electron fuses are set in the built app
        run: npm run check:fuses

      # Starts the built application and drives it. Nothing else here notices a
      # build that packages fine and does not start, or an integrity setting that
      # makes the app refuse to run, and both look like a green build.
      - name: The packaged app starts and holds its guards
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # No display on the runner, and the sandbox helper needs setuid.
            xvfb-run -a npm run smoke:packaged -- -- --no-sandbox --disable-gpu
          else
            npm run smoke:packaged
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: kaleido-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  # The scans that every repository of mine runs, kept in one callable file so
  # that improving one of them is a single edit copied across the three rather
  # than six edits that drift. release.yml calls the same one.
  guards:
    uses: ./.github/workflows/guards.yml
    with:
      # The interface ships its strings in seven languages by design.
      language-excludes: "--exclude-dir=locales"
