name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The same scans the push workflow runs, on the commit about to be published.
  # A gate that publishes has to clear the bar the gate that does not already
  # clears, or the bar is decorative.
  guards:
    uses: ./.github/workflows/guards.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      language-excludes: "--exclude-dir=locales"

  verify:
    name: types, config and live API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:config
      - run: npm run check

      # A tag whose version does not match package.json produces installers
      # named after one version and downloaded from another.
      - name: Tag matches package.json
        shell: bash
        run: |
          declared="v$(node -p "require('./package.json').version")"
          if [ "$declared" != "$TAG" ]; then
            echo "::error::package.json says $declared but the tag is $TAG"
            exit 1
          fi
          echo "$declared matches the tag"

  package:
    name: package (${{ matrix.os }})
    needs: [verify, guards]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: kaleido-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: List what will be attached
        run: find artifacts -type f -printf '%p  %s bytes\n'

      # Published alongside the installers so anyone downloading one can check
      # they got the file this workflow produced, and not something a mirror or
      # a hijacked link handed them instead.
      - name: Checksums
        run: |
          mkdir -p checksums
          find artifacts -type f -exec sha256sum {} + \
            | sed 's|artifacts/[^/]*/||' \
            | sort -k2 > checksums/SHA256SUMS.txt
          cat checksums/SHA256SUMS.txt

      - name: Notes from the changelog
        id: notes
        shell: bash
        run: |
          version="${TAG#v}"
          # Everything between this version's heading and the next one.
          body=$(awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          # No fallback. Generated notes are a list of commit subjects, which
          # tells a reader what was typed and never what changed for them, and a
          # release that quietly shipped them would look finished either way.
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has nothing under a heading for $version"
            exit 1
          fi
          { echo 'body<<KALEIDO_EOF'; echo "$body"; echo 'KALEIDO_EOF'; } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Kaleido Studio ${{ env.TAG }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/**/*
            checksums/SHA256SUMS.txt
          fail_on_unmatched_files: true
