name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build"
        required: true

# Read-only by default. Only the job that publishes is granted more, below.
permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The same scans the push workflow runs, on the commit about to be published.
  # A gate that publishes has to clear the bar the gate that does not already
  # clears, or the bar is decorative.
  guards:
    uses: ./.github/workflows/guards.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      # The interface ships its strings in seven languages by design.
      language-excludes: "--exclude-dir=locales"

  verify:
    name: types, config and live API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:config
      - run: npm run check

      # A tag whose version does not match package.json produces installers
      # named after one version and downloaded from another.
      - name: Tag matches package.json
        shell: bash
        run: |
          declared="v$(node -p "require('./package.json').version")"
          if [ "$declared" != "$TAG" ]; then
            echo "::error::package.json says $declared but the tag is $TAG"
            exit 1
          fi
          echo "$declared matches the tag"

  package:
    name: package (${{ matrix.os }})
    needs: [verify, guards]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The same two gates the push workflow runs, on the build about to be
      # published: a release must clear the bar that an ordinary push clears.
      - name: Electron fuses are set in the built app
        run: npm run check:fuses

      - name: The packaged app starts and holds its guards
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run smoke:packaged -- -- --no-sandbox --disable-gpu
          else
            npm run smoke:packaged
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: kaleido-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish the release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and attach the files
      id-token: write # mint the short-lived certificate the attestation is signed with
      attestations: write # store the attestation next to the repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List what will be attached
        run: find artifacts -type f -printf '%p  %s bytes\n'

      # Published alongside the installers so anyone downloading one can check
      # they got the file this workflow produced, and not something a mirror or
      # a hijacked link handed them instead.
      - name: Checksums
        run: |
          mkdir -p checksums
          find artifacts -type f -exec sha256sum {} + \
            | sed 's|artifacts/[^/]*/||' \
            | sort -k2 > checksums/SHA256SUMS.txt
          cat checksums/SHA256SUMS.txt

      - name: Notes from the changelog
        shell: bash
        run: |
          version="${TAG#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # No fallback. Generated notes are a list of commit subjects, which
          # tells a reader what was typed and never what changed for them, and a
          # release that quietly shipped them would look finished either way.
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has nothing under a heading for $version"
            exit 1
          fi

      # A checksum says the file is the one this workflow produced, to whoever
      # trusts the checksum file. This says which workflow, in which repository, at
      # which commit, signed by a certificate GitHub issued for that run, and it
      # can be checked against GitHub without trusting anything in the release:
      #   gh attestation verify <file> --repo rlpb/kaleido-studio
      # The builds are unsigned by a code-signing certificate, so this is the
      # strongest statement about where a binary came from that they can carry.
      - name: Attest where the installers came from
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb

      # The GitHub CLI already on the runner, rather than a third-party action:
      # this step holds a token that can write to the repository and is handed
      # every installer, which is a poor place for code nobody here reviews.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -type f | sort)
          files+=(checksums/SHA256SUMS.txt)
          title="Kaleido Studio $TAG"
          # A re-run of a failed publish finds the release already there.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --title "$title" --notes-file notes.md --verify-tag "${files[@]}"
          fi
