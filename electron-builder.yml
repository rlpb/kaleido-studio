appId: dev.kaleido.studio
productName: Kaleido Studio
copyright: Copyright 2026 rlpb

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# The renderer and main bundles are already built; nothing else ships.
asar: true

# Switches compiled into the Electron binary. They close ways of abusing the
# executable that a user's own copy of the app does not need, and they are read
# back from the built binary by scripts/check-fuses.mjs on every build.
electronFuses:
  # The signed executable stops being usable as a general Node interpreter.
  runAsNode: false
  # NODE_OPTIONS and --inspect are how a running app is attached to from outside.
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Code is loaded from app.asar only, and the archive is verified against a
  # digest embedded when it was built.
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  # Left on deliberately: the page is served from file://, and its module
  # scripts need what this grants. Turning it off means serving the page from a
  # custom protocol first.
  grantFileProtocolExtraPrivileges: true

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true

mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Unsigned builds still need the entitlement to reach the network.
  hardenedRuntime: false

linux:
  category: Graphics
  maintainer: rlpb <rlpb@users.noreply.github.com>
  synopsis: AI media generation through OpenRouter
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    entry:
      Name: Kaleido Studio
      Comment: Generate images, video, speech and transcriptions on OpenRouter

publish: null
