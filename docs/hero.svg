<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Kaleido Studio: images, video, speech and transcription on OpenRouter">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFBFE"/>
      <stop offset="1" stop-color="#EFF1F7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F8FC"/>
    </linearGradient>
    <linearGradient id="wedgeA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6CFF"/>
      <stop offset="1" stop-color="#5AA8FF"/>
    </linearGradient>
    <linearGradient id="wedgeB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38D4D4"/>
      <stop offset="1" stop-color="#7ED680"/>
    </linearGradient>
    <linearGradient id="wedgeC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B544"/>
      <stop offset="1" stop-color="#F2635F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#141721" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#paper)"/>

  <!-- The mark: a six-wedge ring, the same shape the app uses as its icon. -->
  <g transform="translate(112 168)">
    <circle cx="70" cy="70" r="70" fill="#12151D"/>
    <g transform="translate(70 70)">
      <path d="M0 0 L0 -56 A56 56 0 0 1 48.5 -28 Z" fill="#7C6CFF"/>
      <path d="M0 0 L48.5 -28 A56 56 0 0 1 48.5 28 Z" fill="#5AA8FF"/>
      <path d="M0 0 L48.5 28 A56 56 0 0 1 0 56 Z" fill="#38D4D4"/>
      <path d="M0 0 L0 56 A56 56 0 0 1 -48.5 28 Z" fill="#7ED680"/>
      <path d="M0 0 L-48.5 28 A56 56 0 0 1 -48.5 -28 Z" fill="#F2B544"/>
      <path d="M0 0 L-48.5 -28 A56 56 0 0 1 0 -56 Z" fill="#F2635F"/>
      <circle cx="0" cy="0" r="22" fill="#12151D"/>
    </g>
  </g>

  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="112" y="140" font-size="21" font-weight="600" letter-spacing="3.4" fill="#5B4BD6">KALEIDO STUDIO</text>

    <text x="292" y="216" font-size="52" font-weight="700" letter-spacing="-1.4" fill="#14171F">
      Every kind of media,
    </text>
    <text x="292" y="278" font-size="52" font-weight="700" letter-spacing="-1.4" fill="#14171F">
      one desktop app.
    </text>

    <text x="292" y="326" font-size="21" fill="#545C70">
      Images, video, speech and transcription on OpenRouter.
    </text>

    <!-- The line that carries the actual idea of the project. -->
    <text x="292" y="360" font-size="17" fill="#838B9E">
      No model is hard-coded: the controls are generated from the live catalog.
    </text>
  </g>

  <!-- Mode tiles, in the order the sidebar lists them. -->
  <g transform="translate(292 400)" filter="url(#soft)" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
    <g>
      <rect width="196" height="72" rx="14" fill="url(#card)" stroke="#E0E3EA"/>
      <g transform="translate(20 24)" stroke="#5B4BD6" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 1.5h20v14H0zM0 11l5-5 4.5 4.5M12 8l2.8-2.8L20 10M14 4.5h.01"/>
      </g>
      <text x="54" y="36" font-size="15" font-weight="600" fill="#14171F">Images</text>
      <text x="54" y="55" font-size="12.5" fill="#838B9E">50 models</text>
    </g>

    <g transform="translate(216 0)">
      <rect width="196" height="72" rx="14" fill="url(#card)" stroke="#E0E3EA"/>
      <g transform="translate(20 24)" stroke="#38A0A0" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 2.5h13v12H0zM13 6.5l7-3.5v11l-7-3.5z"/>
      </g>
      <text x="54" y="36" font-size="15" font-weight="600" fill="#14171F">Video</text>
      <text x="54" y="55" font-size="12.5" fill="#838B9E">27 models</text>
    </g>

    <g transform="translate(432 0)">
      <rect width="196" height="72" rx="14" fill="url(#card)" stroke="#E0E3EA"/>
      <g transform="translate(20 22)" stroke="#B57611" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 0a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V3a3 3 0 0 1 3-3zM2.5 8.5a6.5 6.5 0 0 0 13 0M9 15v3"/>
      </g>
      <text x="54" y="36" font-size="15" font-weight="600" fill="#14171F">Speech</text>
      <text x="54" y="55" font-size="12.5" fill="#838B9E">18 models</text>
    </g>

    <g transform="translate(648 0)">
      <rect width="196" height="72" rx="14" fill="url(#card)" stroke="#E0E3EA"/>
      <g transform="translate(21 22)" stroke="#C8342F" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 0h9l5 5v12a1 1 0 0 1-1 1H1a1 1 0 0 1-1-1V1a1 1 0 0 1 1-1zM10 0v5h5M4 10h8M4 14h5"/>
      </g>
      <text x="54" y="36" font-size="15" font-weight="600" fill="#14171F">Transcription</text>
      <text x="54" y="55" font-size="12.5" fill="#838B9E">20 models</text>
    </g>
  </g>
</svg>
